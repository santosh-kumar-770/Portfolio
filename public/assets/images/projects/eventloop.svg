<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0e1424" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad3)" />

  <g transform="translate(80, 70)">
    <rect width="640" height="460" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect width="640" height="42" rx="14" fill="#0b1120" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="42" cy="21" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="60" cy="21" r="5" fill="#22c55e" opacity="0.8" />
    <text x="320" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">EventLoop — Smart Attendee Matching Engine</text>

    <!-- Visual Architecture / Node Graph -->
    <g transform="translate(50, 70)">
      <!-- Central Node -->
      <rect x="200" y="80" width="140" height="60" rx="10" fill="#14b8a6" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="2" />
      <text x="270" y="106" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">EventLoop Core</text>
      <text x="270" y="125" fill="#2dd4bf" font-family="monospace" font-size="11" text-anchor="middle">RESTful Match Engine</text>

      <!-- Connecting Lines -->
      <line x1="80" y1="50" x2="200" y2="100" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />
      <line x1="80" y1="170" x2="200" y2="120" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />
      <line x1="340" y1="100" x2="460" y2="50" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />
      <line x1="340" y1="120" x2="460" y2="170" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />

      <!-- Left Node 1 -->
      <rect x="0" y="20" width="120" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="60" y="42" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Attendee Profile</text>
      <text x="60" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Skills &amp; Interests</text>

      <!-- Left Node 2 -->
      <rect x="0" y="150" width="120" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="60" y="172" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Conference Tracks</text>
      <text x="60" y="188" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Agenda &amp; Booths</text>

      <!-- Right Node 1 -->
      <rect x="420" y="20" width="120" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="480" y="42" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">1-on-1 Connect</text>
      <text x="480" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Cold-start Solver</text>

      <!-- Right Node 2 -->
      <rect x="420" y="150" width="120" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="480" y="172" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Post-Event Hub</text>
      <text x="480" y="188" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Project Follow-ups</text>

      <!-- Bottom Card -->
      <g transform="translate(0, 240)">
        <rect width="540" height="90" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
        <rect x="16" y="16" width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" />
        <text x="61" y="31" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">IN ACTIVE DEV</text>
        <text x="120" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Django &amp; PostgreSQL Backend Architecture</text>
        <text x="16" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Designed to turn passive event attendance into high-value collaboration opportunities.</text>
      </g>
    </g>
  </g>
</svg>
