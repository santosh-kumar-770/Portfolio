<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="300" r="180" fill="#06b6d4" opacity="0.08" filter="blur(60px)" />

  <!-- App Window Preview -->
  <g transform="translate(100, 80)">
    <!-- Browser Top Bar -->
    <rect width="600" height="440" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="600" height="42" rx="14" fill="#0f172a" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="42" cy="21" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="60" cy="21" r="5" fill="#22c55e" opacity="0.8" />

    <rect x="150" y="10" width="300" height="22" rx="6" fill="#1e293b" />
    <text x="300" y="25" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">stucet.vercel.app</text>

    <!-- Header area -->
    <text x="40" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">STUCET — EAMCET Practice</text>
    <text x="40" y="116" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Centralized previous year question papers & mock exams</text>
    
    <!-- Badges -->
    <rect x="40" y="135" width="80" height="24" rx="12" fill="#0d9488" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1" />
    <text x="80" y="151" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Supabase DB</text>

    <rect x="130" y="135" width="85" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1" />
    <text x="172" y="151" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>

    <!-- Content cards mockup inside -->
    <g transform="translate(40, 180)">
      <rect width="245" height="100" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="6" fill="#0e7490" fill-opacity="0.3" />
      <text x="64" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">EAMCET 2023 - Shift 1</text>
      <text x="64" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Engineering stream • 160 Questions</text>
      <rect x="16" y="68" width="80" height="18" rx="4" fill="#1e293b" />
      <text x="56" y="81" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Solved Key</text>

      <rect x="275" y="0" width="245" height="100" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="291" y="16" width="36" height="36" rx="6" fill="#0e7490" fill-opacity="0.3" />
      <text x="339" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">EAMCET 2022 - Shift 2</text>
      <text x="339" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Engineering stream • 160 Questions</text>
      <rect x="291" y="68" width="80" height="18" rx="4" fill="#1e293b" />
      <text x="331" y="81" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Solved Key</text>
    </g>

    <!-- Lower stats bar -->
    <g transform="translate(40, 310)">
      <rect width="520" height="85" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Organized Question Bank & Instant Solution Viewer</text>
      <text x="20" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Fast query indexing via Supabase backend and responsive client.</text>
      <circle cx="480" cy="42" r="16" fill="#14b8a6" fill-opacity="0.2" />
      <path d="M474 42 L478 46 L486 38" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
