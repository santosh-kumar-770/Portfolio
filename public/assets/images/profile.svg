<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#pGrad)" />

  <!-- Ambient background glow -->
  <circle cx="300" cy="250" r="140" fill="#14b8a6" opacity="0.12" filter="url(#blurFilter)" />
  <circle cx="380" cy="450" r="160" fill="#0284c7" opacity="0.10" filter="url(#blurFilter)" />

  <!-- Outer frame border with subtle cut corners -->
  <rect x="25" y="25" width="550" height="650" rx="20" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="35" y="35" width="530" height="630" rx="16" fill="#090d16" fill-opacity="0.6" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1" />

  <!-- Editorial corner tags -->
  <text x="55" y="70" fill="#2dd4bf" font-family="monospace" font-size="12" letter-spacing="2">01 // SANTOSH KUMAR</text>
  <text x="545" y="70" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">CSE '28</text>

  <!-- Stylized avatar silhouette / builder portrait representation -->
  <g transform="translate(150, 160)">
    <!-- Tech Halo / Ring -->
    <circle cx="150" cy="140" r="110" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="150" cy="140" r="95" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.8" />
    
    <!-- Profile silhouette -->
    <circle cx="150" cy="110" r="50" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M70 240 C70 180, 230 180, 230 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Initials inside -->
    <text x="150" y="122" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="36" font-weight="900" text-anchor="middle">SK</text>
  </g>

  <!-- Tag overlay -->
  <g transform="translate(60, 480)">
    <rect width="480" height="130" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    
    <text x="24" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Itte Santosh Kumar</text>
    <text x="24" y="62" fill="#2dd4bf" font-family="monospace" font-size="12">PYTHON &amp; DJANGO • BUILDER • CREATOR</text>
    
    <line x1="24" y1="78" x2="456" y2="78" stroke="#1e293b" stroke-width="1" />
    
    <circle cx="34" cy="98" r="4" fill="#10b981" />
    <text x="46" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Available for projects &amp; collaborations</text>
  </g>
</svg>
