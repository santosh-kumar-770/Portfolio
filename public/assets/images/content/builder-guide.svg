<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#090d16" />
  <rect width="600" height="600" fill="url(#cGrad3)" />
  
  <rect x="30" y="30" width="540" height="540" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(60, 60)">
    <rect width="100" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1" />
    <text x="50" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BUILDER GUIDE</text>
    
    <text x="0" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="900">STUDENT BUILDER</text>
    <text x="0" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="900">PLAYBOOK</text>
    
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Escaping tutorial hell: build MVPs, ship to production, iterate.</text>
    
