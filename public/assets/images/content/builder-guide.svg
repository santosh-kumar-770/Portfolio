      <text x="24" y="76" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">02. Narrow scope to 1 core capability</text>
      <text x="24" y="110" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">03. Build with minimal reliable stack</text>
      <text x="24" y="144" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">04. Ship, gather feedback &amp; share findings</text>
    </g>
    
    <g transform="translate(0, 420)">
