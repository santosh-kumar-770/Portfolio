<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#090d16" />
  <rect width="600" height="600" fill="url(#cGrad2)" />
  
  <rect x="30" y="30" width="540" height="540" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(60, 60)">
    <rect width="90" height="26" rx="13" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="45" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DJANGO API</text>
    
    <text x="0" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="900">PRODUCTION</text>
    <text x="0" y="115" fill="#34d399" font-family="system-ui, sans-serif" font-size="28" font-weight="900">DJANGO ARCHITECTURE</text>
    
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Clean patterns: ViewSets, Serializers &amp; Query Optimization.</text>
    
    <g transform="translate(0, 190)">
      <rect width="480" height="180" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="24" y="45" fill="#10b981" font-family="monospace" font-size="12">class EventViewSet(viewsets.ModelViewSet):</text>
      <text x="48" y="75" fill="#38bdf8" font-family="monospace" font-size="12">queryset = Event.objects.select_related('host')</text>
      <text x="48" y="105" fill="#fbbf24" font-family="monospace" font-size="12">serializer_class = EventDetailSerializer</text>
      <text x="48" y="135" fill="#a7f3d0" font-family="monospace" font-size="12">permission_classes = [IsAuthenticated]</text>
    </g>
    
    <g transform="translate(0, 420)">
      <text x="0" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">@santoshkumaritte</text>
      <text x="480" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">VIEW CAROUSEL →</text>
    </g>
  </g>
</svg>
